{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Tasks</title>
    <link rel="stylesheet" href="{% static 'gettask.css' %}">
</head>
<body>
    <div class="con">

        {% for prod in task %}
        <div class="div1">
            <h1>Title: {{prod.title}}</h1>
            <h1>Due Date: {{prod.due_date}}</h1>
        <button>
            <a href="http://127.0.0.1:8000/home">Back</a>
        </button>
            <button>
                <a href="/task/{{prod.id}}/">Open</a>
            </button>
        </div>
        {% endfor %}

    </div>
</body>
