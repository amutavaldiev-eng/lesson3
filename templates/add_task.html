{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Add Task</title>
    <link rel="stylesheet" href="{% static 'add_task.css' %}">
</head>
<body>
    <div class="box">
        <h1>Add New Task</h1>
        <form method="POST">
            {% csrf_token %}
            <label>Title</label>
            <input type="text" name="title" placeholder="Enter task title" required>
            <label>Caption</label>
            <textarea name="caption" placeholder="Enter task description" required></textarea>
            <label>Due Date</label>
            <input type="date" name="due_date" required>
            <button type="submit">Add Task</button>
        </form>
        <a href="http://127.0.0.1:8000/tasks">Back</a>
    </div>

</body>
</html>
